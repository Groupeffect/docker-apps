services:
  stablediffusion:
    image: docker.io/pgvector/pgvector:pg16
    # volumes:
    #   - './stablediffusion-data:/'

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: admin
      POSTGRES_DB: postgres_vector
    restart: unless-stopped
    ports:
      - '5432:5432'
  